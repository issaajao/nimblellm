# Local gateway.
#
#   cp .env.example .env      # fill in the providers you use
#   docker compose up --build
#   curl localhost:8080/health

services:
  nimblellm:
    build:
      context: .
      target: runtime
    image: nimblellm:local
    ports:
      - '8080:8080'
    # Provider credentials and gateway keys both come from here. The file is
    # gitignored; only .env.example is committed.
    env_file:
      - .env
    environment:
      NIMBLE_PORT: '8080'
      NIMBLE_LOG_LEVEL: info
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    # The process needs nothing on disk beyond its own read-only code.
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512M

    # Mounting a Google service account key instead of inlining it:
    # volumes:
    #   - ./service-account.json:/secrets/google.json:ro
    # environment:
    #   GOOGLE_APPLICATION_CREDENTIALS: /secrets/google.json
