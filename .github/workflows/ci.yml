name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is the `engines` value; the others are current LTS and
        # current. A failure on the floor means `engines` is a lie.
        node: ['20.19', '22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Formatting
        run: npm run format:check

      - name: Types
        run: npm run typecheck

      - name: Tests
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Package contents
        # Catches a `files` field that would ship the wrong thing, before a
        # release does it for real.
        run: npm pack --dry-run

  no-live-calls:
    name: No live provider calls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-no-live-calls.sh

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    # Advisory feeds change independently of this repo; a new advisory should be
    # visible without blocking unrelated pull requests.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
